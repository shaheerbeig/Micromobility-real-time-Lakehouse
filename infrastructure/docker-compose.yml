services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: mmd-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: mmd-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  spark:
    image: apache/spark:3.5.0
    container_name: mmd-spark
    depends_on:
      - kafka
    environment:
      HOME: /tmp
      SPARK_SUBMIT_OPTS: "-Divy.cache.dir=/tmp/.ivy2/cache -Divy.home=/tmp/.ivy2 -Xmx2g"
      SPARK_DRIVER_MEMORY: "2g"
      SPARK_EXECUTOR_MEMORY: "1g"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /tmp/.ivy2/cache;
        /opt/spark/bin/spark-submit
        --driver-memory 2g
        --executor-memory 1g
        --conf spark.jars.ivy=/tmp/.ivy2
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,io.delta:delta-spark_2.12:3.2.0
        --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
        --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
        /opt/spark_streaming/bronze_writer.py
    volumes:
      - ../spark_streaming:/opt/spark_streaming
      - ../lakehouse:/opt/lakehouse
    mem_limit: "4g"

  airflow-postgres:
    image: postgres:15
    container_name: mmd-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: ./airflow
    container_name: mmd-airflow-init
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname admin --lastname user --role Admin --email admin@example.com || true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ../lakehouse:/opt/lakehouse
      - /var/run/docker.sock:/var/run/docker.sock

  airflow-webserver:
    build:
      context: ./airflow
    container_name: mmd-airflow-webserver
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ../lakehouse:/opt/lakehouse
      - /var/run/docker.sock:/var/run/docker.sock

  airflow-scheduler:
    build:
      context: ./airflow
    container_name: mmd-airflow-scheduler
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__TASK_EXECUTION_TIMEOUT: 3600
      AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: 60
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ../lakehouse:/opt/lakehouse
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: "2g"

  dashboard:
    build:
      context: ../dashboard
    container_name: mmd-dashboard
    depends_on:
      - spark
    ports:
      - "8501:8501"
    volumes:
      - ../lakehouse:/app/lakehouse:ro

volumes:
  airflow_postgres_data:
